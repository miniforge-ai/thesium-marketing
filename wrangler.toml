# Cloudflare Workers + Static Assets configuration for the Thesium
# product portal, served on both https://thesium.me and
# https://thesium.app.
#
# Zero-build static deploy — no `main` Worker, just an [assets]
# block that uploads everything in the repo root. Cloudflare's
# Workers Builds runs `wrangler deploy` against this file on every
# push to main.
#
# The macOS app's App Store Connect listing points at
# https://thesium.app/privacy and https://thesium.app/support;
# those URLs MUST resolve or Apple hard-rejects the submission.
# Neither host redirects — both serve, and every page carries a
# rel="canonical" pointing at thesium.me. Cloudflare's default
# extension-stripping serves /privacy → privacy.html.

name = "thesium-risk"
compatibility_date = "2026-04-19"

[assets]
directory = "./"
not_found_handling = "404-page"

# Custom domains stay attached through the Cloudflare dashboard, not
# from here. Declaring them as `routes` makes every deploy fail for any
# hostname whose zone is not on Cloudflare, and a failed deploy stops
# shipping the App Store-required /privacy and /support pages. Four
# hostnames are bound: thesium.me, www.thesium.me, thesium.app,
# www.thesium.app — see "Hostnames" in README.md.
